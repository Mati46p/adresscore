<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Katalog adresów w Krakowie i okolicznych gminach." />
    <meta name="theme-color" content="#1F5C46" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/katalog/katalog.css" />
    <title>Katalog adresów – adresscore</title>
  </head>
  <body>
    <header class="naglowek">
      <a href="/#/" class="logo">
        <svg width="26" height="28" viewBox="0 0 26 28" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M13 2 L24 8 L24 20 L13 26 L2 20 L2 8 Z" />
          <path d="M13 9 L18 12 L18 17 L13 20 L8 17 L8 12 Z" fill="currentColor" />
        </svg>
        <span>adresscore</span>
        <span class="logo-miasto">Kraków</span>
      </a>
      <a href="/#/" class="przycisk">Mapa i filtry</a>
    </header>
    <main>
      <div class="wstep">
        <p class="etykieta">Katalog adresów</p>
        <h1>Znajdź adres</h1>
        <p>Wyszukaj ulicę, miejscowość lub numer. Otwórz kartę adresu, aby zobaczyć dane o okolicy.</p>
      </div>
      <form id="filtry" role="search">
        <label for="szukaj">Adres</label>
        <input id="szukaj" type="search" placeholder="Np. Długa 12, Kraków" autocomplete="off" />
        <label for="gmina">Gmina</label>
        <select id="gmina"><option value="">Wszystkie gminy</option></select>
      </form>
      <p id="stan" role="status">Wczytywanie adresów…</p>
      <ul id="wyniki" aria-label="Znalezione adresy"></ul>
      <nav id="strony" aria-label="Strony wyników" hidden>
        <button id="poprzednia" type="button">← Poprzednia</button>
        <span id="strona"></span>
        <button id="nastepna" type="button">Następna →</button>
      </nav>
    </main>
    <script type="module" src="/katalog/katalog.js"></script>
  </body>
</html>
