# Deploy na Vercel z CI, a nie z integracji Gita: Vercel blokuje deploy commitów
# od autorów spoza zespołu (prywatne repo), a z tokenem autor nie ma znaczenia.
# Wdrażamy tylko commit z [wdroz] na main (robi integrator) albo ręcznie.
name: wdroz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wdroz-produkcja
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_LC0US1gV8mU52CZthShog0Th
  VERCEL_PROJECT_ID: prj_cAKPBOwFsfXqfOXBmEw1acktqnca

jobs:
  produkcja:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wdroz]')
    runs-on: ubuntu-latest
    env:
      MA_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Brak tokena
        if: env.MA_TOKEN != 'true'
        run: |
          echo "::error::Brak sekretu VERCEL_TOKEN w repo – deploy niemożliwy."
          exit 1
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
